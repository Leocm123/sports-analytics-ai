[pytest]
# Rodar a partir da pasta backend/:
#   pytest              -> testes offline (rápidos, sem internet)
#   pytest -m online    -> testes que chamam a ESPN de verdade
#
# pythonpath = . deixa os testes importarem `app.` do mesmo jeito que os
# scripts fazem com `python -m`.
pythonpath = .
testpaths = tests
markers =
    online: chama a ESPN de verdade (rodar com: pytest -m online)
# Por padrão, pula os testes online. Um "-m" na linha de comando substitui este.
addopts = -m "not online"
